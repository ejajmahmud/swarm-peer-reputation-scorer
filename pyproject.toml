[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-peer-reputation-scorer"
version = "0.1.0"
description = "EigenTrust-inspired peer evaluation and historical reliability scoring for subagent task assignment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-peer-reputation-scorer = "swarm_peer_reputation_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_peer_reputation_scorer*"]
